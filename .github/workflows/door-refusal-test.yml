name: door refusal test

# TEMPORARY (docs/nixos-migration.md, Phase 4): prove that this repo's GitHub
# identity can deploy only its own app. It logs in as woodshed, confirms that works
# (the control), and then shows that the same identity cannot log in as studentbase.
# Run it by hand (workflow_dispatch), then delete this file.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  refuse:
    runs-on: ubuntu-latest
    # The same environment the real deploy uses, so the OIDC `sub` is identical.
    environment: production
    steps:
      # Same binary and checksum as hub's deploy.yml.
      - name: Install opkssh
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/opkssh \
            https://github.com/openpubkey/opkssh/releases/download/v0.20.0/opkssh-linux-amd64
          echo "1744460367ec1c79f78bde7398737b44556d167957134666107133d6ccadc846  /tmp/opkssh" | sha256sum -c -
          install -m 755 /tmp/opkssh /usr/local/bin/opkssh

      - name: Log in with this repo's identity
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          opkssh login github -i ~/.ssh/hub_door
          # The box's pinned host key (hub's hosts/hub/keys/ssh_host_ed25519_key.pub).
          echo "ssh.waqasali.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDbeyVG0gsnVZHw9dKSuVdwt3eIQiGNC5Vvm2G8qUbW9" > ~/.ssh/known_hosts

      # Control: the identity is real and reaches the forced command as woodshed.
      # An empty bundle makes hub-deploy fail harmlessly; what matters is that ssh
      # authenticated (exit 255 would mean it did not).
      - name: Control - the identity logs in as woodshed
        run: |
          set +e
          printf '' | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -i ~/.ssh/hub_door woodshed@ssh.waqasali.dev > /tmp/control 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 255 ]; then
            echo "FAIL: this repo's identity could not log in as itself" >&2
            cat /tmp/control >&2
            exit 1
          fi
          echo "OK: authenticated as woodshed (hub-deploy exited $rc on the empty bundle)"

      # The property under test: the same cert must not become studentbase.
      - name: Test - deploying as studentbase is refused
        run: |
          set +e
          printf '' | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -i ~/.ssh/hub_door studentbase@ssh.waqasali.dev > /tmp/denied 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 255 ] || ! grep -q 'Permission denied' /tmp/denied; then
            echo "FAIL: expected a publickey denial; got exit $rc" >&2
            cat /tmp/denied >&2
            exit 1
          fi
          echo "OK: studentbase refused (exit 255, Permission denied)"
