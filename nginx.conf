server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-like assets on the fly. gzip_proxied any is required
    # because traefik terminates TLS and forwards requests (they carry a Via
    # header), and nginx skips compression for proxied requests by default.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm
        font/woff2;

    # Vite emits hashed asset filenames, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: no client-side routing today, but cheap insurance that a
    # deep link resolves to index.html rather than a nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}