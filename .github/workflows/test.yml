name: test

# PR gate for woodshed, and the gate deploy.yml reuses so main cannot ship
# something that does not pass. Mirrors studentbase's test.yml, minus the
# backing services a static site has no use for.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  # Cancelling a PR run is free; cancelling one gating a deploy is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        # --ignore-scripts for the same reason the Dockerfile uses it, but the
        # musicxml tests render OSMD and need canvas's native prebuilt binary —
        # without it jsdom's getContext returns null and OSMD crashes.
        # Rebuild just that one package instead of enabling every install script.
        run: |
          npm ci --ignore-scripts
          npm rebuild canvas

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # tsc -b is part of `npm run build`, so this is also the typecheck step.
      - name: Build
        run: npm run build

  image:
    name: image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built here and not only in hub's deploy so a Dockerfile regression is
      # caught on the PR, not on a push to main.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: woodshed:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # `load: true` exports through the docker exporter, which cannot take
          # the manifest list that an attestation turns the result into.
          provenance: false

      - name: Smoke test
        run: |
          # No env vars, no volume: DB_PATH and PUBLIC_URL both fall back to
          # their defaults (see server/env.ts) — ephemeral SQLite inside the
          # container, PUBLIC_URL http://localhost:3000. That's exempt from
          # the MCP OAuth router's HTTPS-issuer check (see
          # server/oauth/provider.ts's comment), so the server still boots
          # cleanly with nothing configured, same as the old static image.
          docker run -d --name woodshed-smoke -p 8080:3000 woodshed:ci
          for _ in $(seq 1 20); do
            if curl -fs http://localhost:8080/ >/dev/null 2>&1; then
              echo "index.html served."
              curl -fs http://localhost:8080/ | grep -q '<div id="root"></div>'
              # /api/* must reject an unauthenticated request rather than
              # ever falling through to the SPA fallback and serving HTML.
              status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/pieces)
              if [ "$status" != "401" ]; then
                echo "Expected 401 from /api/pieces, got $status"
                docker logs woodshed-smoke
                docker rm -f woodshed-smoke
                exit 1
              fi
              docker rm -f woodshed-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Container never served index.html:"
          docker logs woodshed-smoke
          docker rm -f woodshed-smoke
          exit 1